# Render Blueprint: https://render.com/docs/blueprint-spec
#
# The database is an external free Neon PostgreSQL instance rather than a
# Render-managed one (Render's free database expires after 30 days). Paste the
# Neon connection string when Render prompts for DATABASE_URL during blueprint
# setup. See DEPLOY.md.
services:
  - type: web
    name: gym-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: DEFAULT_LANGUAGE
        value: en
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      # LLM features stay off until a provider is configured.
      # Free options: LLM_PROVIDER=groq + LLM_API_KEY, or
      # LLM_PROVIDER=openai + LLM_BASE_URL + LLM_API_KEY + LLM_MODEL
      # (OpenRouter free models, Cerebras, Gemini's OpenAI-compat path).
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: ""
      - key: LLM_BASE_URL
        sync: false
