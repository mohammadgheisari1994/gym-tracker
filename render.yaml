# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gym-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-tracker-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: DEFAULT_LANGUAGE
        value: en
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      # LLM features are off until a provider is configured in the dashboard.
      # For a free option, set LLM_PROVIDER=groq + LLM_API_KEY, or
      # LLM_PROVIDER=openai + LLM_BASE_URL + LLM_API_KEY + LLM_MODEL
      # (OpenRouter free models, Cerebras, Gemini's OpenAI-compat path).
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: ""
      - key: LLM_BASE_URL
        sync: false

databases:
  - name: gym-tracker-db
    plan: free
    databaseName: gym
    user: gym
