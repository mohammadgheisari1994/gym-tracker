# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gym-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-tracker-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: DEFAULT_LANGUAGE
        value: en
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"

databases:
  - name: gym-tracker-db
    plan: free
    databaseName: gym
    user: gym
